<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{label}} · {{site_title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/style.css{{css_v}}">
</head>
<body id="top" class="event-page">
  <header class="event-header">
    <a class="back" href="../../{{home}}">&larr; All memories</a>
    {{year}}
    <h1>{{title}}</h1>
    <p class="event-count">{{count}} photos &middot; tap any photo to see it full size</p>
  </header>

  <main>
    <div class="gallery">{{tiles}}
    </div>
  </main>

  <div class="viewer" hidden>
    <button class="viewer-close" aria-label="Close">&times;</button>
    <button class="viewer-prev" aria-label="Previous photo">&lsaquo;</button>
    <figure>
      <img alt="">
      <figcaption><span class="viewer-caption"></span><span class="viewer-count"></span></figcaption>
    </figure>
    <button class="viewer-next" aria-label="Next photo">&rsaquo;</button>
  </div>

  <footer>
    <p><a class="to-top" href="#top">&uarr; Back to top</a></p>
    <p><a href="../../{{home}}">Back to all memories</a></p>
  </footer>
  <script src="../../assets/gallery.js{{js_v}}"></script>
</body>
</html>
